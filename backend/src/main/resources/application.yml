spring:
  application:
    name: billwatch
  datasource:
    url: jdbc:postgresql://localhost:5432/Billwatch?currentSchema=billwatch
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  flyway:
    schemas: billwatch
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: localhost
    port: 1025

server:
  port: 8080

boletos:
  dias-aviso: 7

jwt:
  secret: change-me-in-production
  expiracao-minutos: 1440

uploads:
  diretorio: ./uploads
