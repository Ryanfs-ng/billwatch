spring:
  application:
    name: billwatch
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/billwatch?currentSchema=billwatch
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  flyway:
    schemas: billwatch
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: localhost
    port: 1025
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

boletos:
  dias-aviso: 7
  aviso-cron: ${BOLETOS_AVISO_CRON:0 0 8 * * *}
  resumo-cron: ${BOLETOS_RESUMO_CRON:0 0 8 * * MON}

jwt:
  secret: ${JWT_SECRET}
  expiracao-minutos: 1440

uploads:
  diretorio: ./uploads

app:
  url-frontend: http://localhost:5173
  link-reset-senha: ${app.url-frontend}/redefinir-senha
