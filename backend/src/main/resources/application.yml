spring:
  application:
    name: billwatch
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/billwatch?currentSchema=billwatch}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  flyway:
    schemas: billwatch
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

boletos:
  dias-aviso: 7
  aviso-cron: ${BOLETOS_AVISO_CRON:0 0 8 * * *}
  resumo-cron: ${BOLETOS_RESUMO_CRON:0 0 8 * * MON}
  recorrencia-cron: ${BOLETOS_RECORRENCIA_CRON:0 0 6 * * *}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

jwt:
  secret: ${JWT_SECRET}
  expiracao-minutos: 1440

app:
  url-frontend: ${APP_URL_FRONTEND:http://localhost:5173}
  origens-permitidas: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  email-remetente: ${MAIL_FROM:BillWatch <nao-responda@billwatch.local>}
  link-reset-senha: ${app.url-frontend}/redefinir-senha
  link-confirmar-email: ${app.url-frontend}/confirmar-email
  link-confirmar-novo-email: ${app.url-frontend}/confirmar-novo-email
